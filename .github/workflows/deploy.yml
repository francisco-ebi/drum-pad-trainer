name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let an in-flight one finish rather than
# cancelling it half-way through publishing.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The project pins Yarn 4 through `packageManager`, which Corepack
      # resolves. Enabled before any yarn command runs.
      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      # --immutable fails the build if yarn.lock would need changing, so a
      # deploy always installs exactly what was committed.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Check architecture boundaries
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # `yarn build` runs `tsc -b` before Vite, so a type error fails here
      # rather than shipping. BASE_PATH tells Vite where the site will live —
      # `/drum-path-trainer/` for this repo, or `/` behind a custom domain.
      - name: Build
        run: yarn build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
